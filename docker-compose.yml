version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: brick-counter-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Backend API URL (connect to backend service)
      NEXT_PUBLIC_BACKEND_URL: http://localhost:5555
      NEXT_PUBLIC_WS_URL: http://localhost:5555
    ports:
      - '3000:3000'

    volumes:
      - ./:/app
      - /app/node_modules
